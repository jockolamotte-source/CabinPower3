}

android {
    namespace 'com.cabinpower.solar3'
    compileSdk 35

    defaultConfig {
        applicationId 'com.cabinpower.solar3'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '3.0.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
